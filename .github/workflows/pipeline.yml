      #    git push

      #- name: 📊 Check progress after batch 3
      #  run: sqlite3 storage/estate.db "SELECT COUNT(*) FROM bronze_estate;"

      #- name: 🟤 Bronze batch 4 (24001–32000)
      #  run: python -m pipeline.bronze.loader --start 24001 --end 34000

      #- name: 💾 Commit after batch 4
      #  run: |
      #    git config --global user.name "github-actions[bot]"
      #    git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #    git add storage/estate.db
      #    git commit -m "Bronze batch 4" || echo "No changes"
      #    git push

      #- name: 📊 Check progress after batch 4
      #  run: sqlite3 storage/estate.db "SELECT COUNT(*) FROM bronze_estate;"

      - name: 📎 Upload bronze logs
        uses: actions/upload-artifact@v4
        with:
          name: bronze-logs-${{ github.run_number }}
          path: logs/

  silver:
    needs: bronze
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
  
      - name: Pull latest database after bronze
        run: |
          git fetch origin main
          git checkout origin/main -- storage/estate.db

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: ⚙️ Silver → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_silver

      - name: 📎 Upload silver logs
        uses: actions/upload-artifact@v4
        with:
          name: silver-logs-${{ github.run_number }}
          path: logs/
