name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links-loader:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Git LFS
        run: git lfs install

  restore-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup LFS
        run: git lfs install

      - name: Reset last commit (revert f95b75d)
        run: |
          git reset --hard HEAD~1  # Откат на 1 коммит назад (убирает удаление)
          git push origin main --force-with-lease  # Безопасный push
