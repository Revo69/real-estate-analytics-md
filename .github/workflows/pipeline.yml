name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links-loader:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: Clear undetected_chromedriver cache
        run: rm -rf ~/.local/share/undetected_chromedriver

      - name: Setup Chrome + Driver 
        uses: browser-actions/setup-chrome@v1 
      - name: Setup ChromeDriver 
        uses: nanasess/setup-chromedriver@v2

      - name: 🗄️ Initialize DB
        run: python -m scripts.init_db

      # Run link loader in batches
      - name: 🔗 Run links loader (pages 1-10)
        run: python -m pipeline.acquisition.links_loader --start 1 --end 10

      - name: 💾 Commit after batch 1
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Update raw_links batch 1-100" || echo "No changes"
          git push origin main --force

    #  - name: 🔗 Run links loader (pages 101-200)
    #    run: python -m pipeline.acquisition.links_loader --start 101 --end 200
