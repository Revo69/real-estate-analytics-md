name: Real Estate Pipeline
on:
  schedule:
    - cron: '0 2 * * *'   # Каждый день в 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # нужен для download-artifact в том же workflow

jobs:
  # ==============================================================
  # 1. Сбор ссылок → только обновляет DB → заливает как artifact
  # ==============================================================
  collect-links:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout + Full LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS + download all objects
        run: |
          git lfs install
          git lfs fetch --all origin
          git lfs checkout

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clear undetected_chromedriver cache
        run: rm -rf ~/.local/share/undetected_chromedriver

      - name: Setup Chrome + ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Initialize DB
        run: python -m scripts.init_db



  # ==============================================================
  # 2. Bronze-парсинг → берёт DB из artifact → заливает обратно
  # ==============================================================
  parse-bronze:
    needs: collect-links
    if: ${{ needs.collect-links.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      has_bronze_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout + Full LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS + pull all
        run: |
          git lfs install
          git lfs fetch --all origin
          git lfs checkout



  # ==============================================================
  # 3. ЕДИНСТВЕННЫЙ job, который делает commit + push
  # ==============================================================
  commit-and-push:
    needs: [collect-links, parse-bronze]
    if: >
      needs.collect-links.outputs.has_changes == 'true' ||
      needs.parse-bronze.outputs.has_bronze_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout + Full LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs fetch --all origin
          git lfs checkout


  # ==============================================================
  # 4. Silver → Supabase
  # ==============================================================
  silver:
    needs: commit-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS + pull
        run: |
          git lfs install
          git lfs fetch --all origin
          git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Silver → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_silver

      - name: Upload silver logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-silver-${{ github.run_number }}
          path: logs/

  # ==============================================================
  # 5. Gold → Supabase
  # ==============================================================
  gold:
    needs: silver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Gold → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_gold

      - name: Upload gold logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-gold-${{ github.run_number }}
          path: logs/
