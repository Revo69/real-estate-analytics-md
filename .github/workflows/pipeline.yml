name: Real Estate Pipeline
on:
  schedule:
    - cron: '0 2 * * *'   # Каждый день в 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================================================================
  # 1. Сбор ссылок (raw_links)
  # ==================================================================
  links-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout + Full history + LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0                  # Обязательно для git lfs push --all

      - name: Setup Git LFS
        run: git lfs install

      - name: Download ALL existing LFS objects (актуально 2025)
        run: |
          git lfs fetch --all origin      # ← заменяет устаревший pull --all
          git lfs checkout

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Chrome + Driver
        run: |
          rm -rf ~/.local/share/undetected_chromedriver
          browser-actions/setup-chrome@v1
          nanasess/setup-chromedriver@v2

      - name: Initialize DB
        run: python -m scripts.init_db

      # Batch 1
      - name: Links loader 1–100
        run: python -m pipeline.acquisition.links_loader --start 1 --end 100

      - name: Commit & Push batch 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "raw_links: batch 1–100" || echo "No changes"
          git push origin main
          git lfs push --all origin main

      # Batch 2
      - name: Links loader 101–200
        run: python -m pipeline.acquisition.links_loader --start 101 --end 200

      - name: Commit & Push batch 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "raw_links: batch 101–200" || echo "No changes"
          git push origin main
          git lct push --all origin main

      # Добавляй остальные батчи точно так же

      - name: Check raw_links count
        run: sqlite3 storage/estate.db "SELECT COUNT(*) FROM raw_links;"

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: links-logs-${{ github.run_number }}
          path: logs/

  # ==================================================================
  # 2. Парсинг объявлений (bronze)
  # ==================================================================
  bronze:
    needs: links-loader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout + Full LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: git lfs install

      - name: Download ALL LFS objects
        run: |
          git lfs fetch --all origin
          git lfs checkout

      - name: Set up Python + deps
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Setup Chrome
        run: |
          rm -rf ~/.local/share/undetected_chromedriver
          browser-actions/setup-chrome@v1
          nanasess/setup-chromedriver@v2

      # Batch 1
      - name: Bronze 0–8000
        run: python -m pipeline.bronze.loader --start 0 --end 8000

      - name: Commit & Push bronze batch 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git restore --staged .github/workflows || true
          git restore --staged .github/ || true
          git commit -m "bronze: batch 0–8000" || echo "No changes"
          git push origin main
          git lfs push --all origin main

      # Batch 2
      - name: Bronze 8001–16000
        run: python -m pipeline.bronze.loader --start 8001 --end 16000

      - name: Commit & Push bronze batch 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git restore --staged .github/workflows || true
          git restore --staged .github/ || true
          git commit -m "bronze: batch 8001–16000" || echo "No changes"
          git push origin main
          git lfs push --all origin main

      - name: Upload bronze logs
        uses: actions/upload-artifact@v4
        with:
          name: bronze-logs-${{ github.run_number }}
          path: logs/

  # ==================================================================
  # 3. Silver → Supabase
  # ==================================================================
  silver:
    needs: bronze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout + LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS + download objects
        run: |
          git lfs install
          git lfs fetch --all origin
          git lfs checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Silver → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_silver

      - name: Upload silver logs
        uses: actions/upload-artifact@v4
        with:
          name: silver-logs-${{ github.run_number }}
          path: logs/

  # ==================================================================
  # 4. Gold → Supabase
  # ==================================================================
  gold:
    needs: silver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Gold → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_gold

      - name: Upload gold logs
        uses: actions/upload-artifact@v4
        with:
          name: gold-logs-${{ github.run_number }}
          path: logs/
