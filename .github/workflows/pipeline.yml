name: Real Estate Pipeline

on:
  schedule:
    - cron: "0 1 * * *" # every day at 01:00 UTC
  workflow_dispatch:

concurrency:
  group: real-estate-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==============================================================
  # 2. Bronze-scraping → Supabase
  # ==============================================================
  parse-bronze:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours for bronze parsing

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome + force correct driver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Setup Chrome Driver with version matching
        run: |
          echo "🔧 Setting up Chrome Driver for bronze parsing..."

          # Get Chrome version details
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)

          echo "Chrome version: $CHROME_VERSION"
          echo "Chrome major: $CHROME_MAJOR"

          # Complete cleanup
          rm -rf ~/.local/share/undetected_chromedriver
          rm -rf /tmp/undetected_chromedriver
          rm -rf /tmp/.com.google.Chrome.*

          # Create cache directory with version
          mkdir -p ~/.local/share/undetected_chromedriver
          echo "$CHROME_MAJOR" > ~/.local/share/undetected_chromedriver/VERSION

          # Verify
          which google-chrome
          google-chrome --version

          echo "✅ Chrome setup complete"

      - name: Configure system for long-running connections
        run: |
          echo "🔧 Configuring system timeouts..."

          # Increase TCP keepalive for long connections (fixes DevTools timeout)
          echo "net.ipv4.tcp_keepalive_time = 300" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_keepalive_intvl = 60" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_keepalive_probes = 5" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

          echo "✅ System timeouts configured"

      - name: Create logs directory
        run: mkdir -p logs

      - name: Process next 500 pending links — iteration 1
        id: bronze_1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Processing next 500 pending links — iteration 1..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120

      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Process next 500 pending links — iteration 2
        id: bronze_2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Processing next 500 pending links — iteration 2..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120

      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Process next 500 pending links — iteration 3
        id: bronze_3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Processing next 500 pending links — iteration 3..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120

      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Process next 500 pending links — iteration 4
        id: bronze_4
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Processing next 500 pending links — iteration 4..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120

      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Process next 500 pending links — iteration 5
        id: bronze_5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Processing next 500 pending links — iteration 5..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120

      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Process next 500 pending links — iteration 6
        id: bronze_6
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Processing next 500 pending links — iteration 6..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120

      - name: Upload bronze logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bronze-loader-logs
          path: logs/
          retention-days: 7

      - name: Processing statistics
        if: always()
        run: |
          echo "📊 Analyzing processing results..."

          if [ -f logs/bronze_loader.log ]; then
            echo ""
            echo "=== Last 100 lines of log ==="
            tail -n 100 logs/bronze_loader.log
            
            echo ""
            echo "=== Statistics ==="
            
            # Count different statuses
            SUCCESS=$(grep -c "✅ Link status updated successfully" logs/bronze_loader.log || echo "0")
            FAILED=$(grep -c "Parse status: failed" logs/bronze_loader.log || echo "0")
            TIMEOUT=$(grep -c "Parse status: timeout" logs/bronze_loader.log || echo "0")
            WEBDRIVER=$(grep -c "Parse status: webdriver_error" logs/bronze_loader.log || echo "0")
            
            echo "Successful: $SUCCESS"
            echo "Failed: $FAILED"
            echo "Timeouts: $TIMEOUT"
            echo "WebDriver errors: $WEBDRIVER"
            
          else
            echo "⚠️ Log file not found"
          fi

      - name: Validate bronze processing result
        if: always()
        run: |
          failed=0

          if [ "${{ steps.bronze_1.outcome }}" != "success" ]; then
            echo "❌ Bronze iteration 1 failed"
            failed=1
          fi

          if [ "${{ steps.bronze_2.outcome }}" != "success" ]; then
            echo "❌ Bronze iteration 2 failed"
            failed=1
          fi

          if [ "${{ steps.bronze_3.outcome }}" != "success" ]; then
            echo "❌ Bronze iteration 3 failed"
            failed=1
          fi

          if [ "${{ steps.bronze_4.outcome }}" != "success" ]; then
            echo "❌ Bronze iteration 4 failed"
            failed=1
          fi

          if [ "${{ steps.bronze_5.outcome }}" != "success" ]; then
            echo "❌ Bronze iteration 5 failed"
            failed=1
          fi

          if [ "${{ steps.bronze_6.outcome }}" != "success" ]; then
            echo "❌ Bronze iteration 6 failed"
            failed=1
          fi

          if [ "$failed" -eq 1 ]; then
            echo "❌ One or more Bronze iterations failed"
            exit 1
          fi

          echo "✅ All Bronze iterations completed successfully"
  # ==============================================================
  # 3. Silver → Supabase
  # ==============================================================
  silver:
    needs: parse-bronze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: pip install -r requirements.txt

      - name: Run Silver transformation
        id: run_silver
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_silver

  # ==============================================================
  # 4. Gold → Supabase
  # ==============================================================
  gold:
    needs: silver
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: pip install -r requirements.txt

      - name: Run Gold refresh
        id: run_gold
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_gold

      - name: Upload Gold logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gold-loader-logs
          path: logs/
          retention-days: 7

  # ==============================================================
  # 5. Notify on failure (telegram)
  # ==============================================================
  notify-on-failure:
    needs: [parse-bronze, silver, gold]
    if: ${{ always() && (needs.parse-bronze.result == 'failure' || needs.silver.result == 'failure' || needs.gold.result == 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Send Telegram failure alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pip install --disable-pip-version-check requests

          failed_stage="unknown"

          if [ "${{ needs.parse-bronze.result }}" = "failure" ]; then
            failed_stage="parse-bronze"
          elif [ "${{ needs.silver.result }}" = "failure" ]; then
            failed_stage="silver"
          elif [ "${{ needs.gold.result }}" = "failure" ]; then
            failed_stage="gold"
          fi

          python -m scripts.send_telegram_alert \
            --stage "$failed_stage" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
