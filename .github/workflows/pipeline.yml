name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 9 * * *'   # every day at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  # ==============================================================
  # 3. Silver → Supabase
  # ==============================================================
  silver:
    #needs: parse-bronze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Silver → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_silver

  # ==============================================================
  # 4. Gold → Supabase
  # ==============================================================
  gold:
    needs: silver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Gold → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_gold
