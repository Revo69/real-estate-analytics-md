"""
debug_single.py — локальный тест парсинга одного URL без Supabase.

Использование:
    python debug_single.py https://999.md/ru/89760365
    python debug_single.py          # DEFAULT_URL

Результат: консоль + debug_output.json + debug_page.html рядом со скриптом.
"""

name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  collect-links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install latest stable Chrome + auto-matched driver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      
      - name: Clean & force correct undetected-chromedriver version
        run: |
          echo "🔧 Setting up Chrome Driver for links collection..."
          
          # Clean all caches
          rm -rf ~/.local/share/undetected_chromedriver
          rm -rf /tmp/undetected_chromedriver
          rm -rf /tmp/.com.google.Chrome.*
          
          # Get Chrome major version
          MAJOR=$(google-chrome --version | grep -oE '[0-9]+' | head -1)
          
          # Create cache with version
          mkdir -p ~/.local/share/undetected_chromedriver
          echo "$MAJOR" > ~/.local/share/undetected_chromedriver/VERSION
          
          echo "Chrome major version: $MAJOR"
          google-chrome --version
      
      - name: Create logs directory
        run: mkdir -p logs
      
      - name: Run links loader → Supabase (Batch 1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m pipeline.acquisition.links_loader --start 1 --end 100
        continue-on-error: true
      
      - name: Run links loader → Supabase (Batch 2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m pipeline.acquisition.links_loader --start 101 --end 200
        continue-on-error: true
      
      - name: Upload links logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: links-loader-logs
          path: logs/
          retention-days: 7  

  # ==============================================================
  # 2. Bronze-scraping → Supabase
  # ==============================================================
  parse-bronze:
    needs: collect-links
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours for bronze parsing
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Chrome + force correct driver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      
      - name: Setup Chrome Driver with version matching
        run: |
          echo "🔧 Setting up Chrome Driver for bronze parsing..."
          
          # Get Chrome version details
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
          
          echo "Chrome version: $CHROME_VERSION"
          echo "Chrome major: $CHROME_MAJOR"
          
          # Complete cleanup
          rm -rf ~/.local/share/undetected_chromedriver
          rm -rf /tmp/undetected_chromedriver
          rm -rf /tmp/.com.google.Chrome.*
          
          # Create cache directory with version
          mkdir -p ~/.local/share/undetected_chromedriver
          echo "$CHROME_MAJOR" > ~/.local/share/undetected_chromedriver/VERSION
          
          # Verify
          which google-chrome
          google-chrome --version
          
          echo "✅ Chrome setup complete"
      
      - name: Configure system for long-running connections
        run: |
          echo "🔧 Configuring system timeouts..."
          
          # Increase TCP keepalive for long connections (fixes DevTools timeout)
          echo "net.ipv4.tcp_keepalive_time = 300" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_keepalive_intvl = 60" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_keepalive_probes = 5" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          
          echo "✅ System timeouts configured"
      
      - name: Create logs directory
        run: mkdir -p logs
      
      - name: Run bronze loader → Supabase (Batch 1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
