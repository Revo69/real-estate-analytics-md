name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links-loader:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: Clear undetected_chromedriver cache
        run: rm -rf ~/.local/share/undetected_chromedriver

      - name: Install Google Chrome + matching ChromeDriver
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64 https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
      
          # Узнаём версию установленного Chrome
          CHROME_VERSION=$(google-chrome --version | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "Chrome version: $CHROME_VERSION"
      
          # Ставим точно такой же ChromeDriver
          DRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION%%.*}")
          wget -q https://chromedriver.storage.googleapis.com/${DRIVER_VERSION}/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      - name: 🗄️ Initialize DB
        run: python -m scripts.init_db

      # Run link loader in batches
      - name: 🔗 Run links loader (pages 1-100)
        run: python -m pipeline.acquisition.links_loader --start 1 --end 100

      - name: 💾 Commit after batch 1
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Update raw_links batch 1-100" || echo "No changes"
          git push origin main --force

      - name: 🔗 Run links loader (pages 101-200)
        run: python -m pipeline.acquisition.links_loader --start 101 --end 200

      - name: 💾 Commit after batch 2
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Update raw_links batch 101-200" || echo "No changes"
          git push origin main --force

      - name: 🔗 Run links loader (pages 201-300)
        run: python -m pipeline.acquisition.links_loader --start 201 --end 300

      - name: 💾 Commit after batch 3
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Update raw_links batch 201-300" || echo "No changes"
          git push origin main --force

      - name: 🔗 Run links loader (pages 301-385)
        run: python -m pipeline.acquisition.links_loader --start 301 --end 385

      - name: 💾 Commit after batch 4
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Update raw_links batch 301-385" || echo "No changes"
          git push origin main --force

      - name: 📊 Check raw_links count
        run: sqlite3 storage/estate.db "SELECT COUNT(*) FROM raw_links;"

      - name: 📎 Upload link logs
        uses: actions/upload-artifact@v4
        with:
          name: links-logs-${{ github.run_number }}
          path: logs/

  bronze:
    needs: links-loader
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🌐 Setup Chromium once
        run: |
          sudo snap install chromium
          sudo snap connect chromium:network
          sudo snap connect chromium:network-bind
          sudo snap connect chromium:browser-sandbox
          sudo snap connect chromium:opengl
          sudo snap connect chromium:audio-playback
          sudo snap connect chromium:camera
          sudo snap connect chromium:mount-observe
          sudo snap connect chromium:password-manager-service
          sudo snap connect chromium:system-observe

      - name: 🟤 Bronze batch 1 (0–8000)
        run: python -m scripts.run_bronze --start 0 --end 8000

      - name: 💾 Commit after batch 1
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Bronze batch 1" || echo "No changes"
          git pull --rebase origin main
          git push origin main

      - name: 📊 Check progress after batch 1
        run: sqlite3 storage/estate.db "SELECT COUNT(*) FROM bronze_estate;"

      - name: 🟤 Bronze batch 2 (8001–16000)
        run: python -m scripts.run_bronze --start 8001 --end 16000

      - name: 💾 Commit after batch 2
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Bronze batch 2" || echo "No changes"
          git pull --rebase origin main
          git push origin main

      - name: 📊 Check progress after batch 2
        run: sqlite3 storage/estate.db "SELECT COUNT(*) FROM bronze_estate;"

      - name: 🟤 Bronze batch 3 (16001–24000)
        run: python -m scripts.run_bronze --start 16001 --end 24000

      - name: 💾 Commit after batch 3
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Bronze batch 3" || echo "No changes"
          git pull --rebase origin main
          git push origin main

      - name: 📊 Check progress after batch 3
        run: sqlite3 storage/estate.db "SELECT COUNT(*) FROM bronze_estate;"

      - name: 🟤 Bronze batch 4 (24001–32000)
        run: python -m scripts.run_bronze --start 24001 --end 32000

      - name: 💾 Commit after batch 4
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/estate.db
          git commit -m "Bronze batch 4" || echo "No changes"
          git pull --rebase origin main
          git push origin main

      - name: 📊 Check progress after batch 4
        run: sqlite3 storage/estate.db "SELECT COUNT(*) FROM bronze_estate;"

      - name: 📎 Upload bronze logs
        uses: actions/upload-artifact@v4
        with:
          name: bronze-logs-${{ github.run_number }}
          path: logs/

  silver:
    needs: bronze
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: ⚙️ Silver → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_silver

      - name: 📎 Upload silver logs
        uses: actions/upload-artifact@v4
        with:
          name: silver-logs-${{ github.run_number }}
          path: logs/
