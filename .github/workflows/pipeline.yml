name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 2 * * *'   # Run every day at 02:00 UTC
  workflow_dispatch:       # Manual trigger option
  
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # allow long runs

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 👉 Очистка кеша uc перед запуском
      - name: Clear undetected_chromedriver cache
        run: rm -rf ~/.local/share/undetected_chromedriver

      #- name: Install Chrome and chromedriver
