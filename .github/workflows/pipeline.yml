name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links-loader:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Git LFS
        run: git lfs install

  restore-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
  
      - name: Setup LFS
        run: git lfs install
  
      - name: Revert delete and restore estate.db
        run: |
          # Восстанавливаем из предыдущего коммита (65dc5e)
          git checkout 65dc5e -- storage/estate.db
          git add storage/estate.db
          git commit -m "Revert delete: Restore estate.db from previous commit"
          git push origin main --force     
