name: Real Estate Pipeline

on:
  schedule:
    - cron: "0 1 * * *" # every day at 01:00 UTC
  workflow_dispatch:

concurrency:
  group: real-estate-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==============================================================
  # 4. Gold → Supabase
  # ==============================================================
  gold:
    #needs: silver
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: pip install -r requirements.txt

      - name: Run Gold refresh
        id: run_gold
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_gold

      - name: Upload Gold logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gold-loader-logs
          path: logs/
          retention-days: 7

  # ==============================================================
  # 5. Notify on failure (telegram)
  # ==============================================================
  notify-on-failure:
    needs: [gold]
    if: ${{ always() && (needs.gold.result == 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Send Telegram failure alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pip install --disable-pip-version-check requests

          failed_stage="unknown"

          if [ "${{ needs.gold.result }}" = "failure" ]; then
            failed_stage="gold"
          fi

          python -m scripts.send_telegram_alert \
            --stage "$failed_stage" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
