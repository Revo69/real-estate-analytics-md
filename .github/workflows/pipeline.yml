name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # ==============================================================
  # 2. Bronze-scraping → Supabase
  # ==============================================================
  parse-bronze:
    #needs: collect-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome + force correct driver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - run: |
          rm -rf ~/.local/share/undetected_chromedriver
          MAJOR=$(google-chrome --version | grep -oE '[0-9]+' | head -1)
          mkdir -p ~/.local/share/undetected_chromedriver
          echo "$MAJOR" > ~/.local/share/undetected_chromedriver/VERSION

      - name: Run bronze loader → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m pipeline.bronze.loader --start 0 --end 1000
          #python -m pipeline.bronze.loader --start 1001 --end 2000
  # ==============================================================
  # 3. Silver → Supabase
  # ==============================================================
  silver:
    needs: parse-bronze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Silver → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_silver

  # ==============================================================
  # 4. Gold → Supabase
  # ==============================================================
  gold:
    needs: silver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Gold → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_gold
