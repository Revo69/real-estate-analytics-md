name: Real Estate Pipeline

on:
  schedule:
    - cron: '0 1 * * *'   # every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # ==============================================================
  # 2. Bronze-scraping → Supabase
  # ==============================================================
  parse-bronze:
    #needs: collect-links
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 3 hours for bronze parsing
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Chrome + force correct driver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      
      - name: Setup Chrome Driver with version matching
        run: |
          echo "🔧 Setting up Chrome Driver for bronze parsing..."
          
          # Get Chrome version details
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
          
          echo "Chrome version: $CHROME_VERSION"
          echo "Chrome major: $CHROME_MAJOR"
          
          # Complete cleanup
          rm -rf ~/.local/share/undetected_chromedriver
          rm -rf /tmp/undetected_chromedriver
          rm -rf /tmp/.com.google.Chrome.*
          
          # Create cache directory with version
          mkdir -p ~/.local/share/undetected_chromedriver
          echo "$CHROME_MAJOR" > ~/.local/share/undetected_chromedriver/VERSION
          
          # Verify
          which google-chrome
          google-chrome --version
          
          echo "✅ Chrome setup complete"
      
      - name: Configure system for long-running connections
        run: |
          echo "🔧 Configuring system timeouts..."
          
          # Increase TCP keepalive for long connections (fixes DevTools timeout)
          echo "net.ipv4.tcp_keepalive_time = 300" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_keepalive_intvl = 60" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_keepalive_probes = 5" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          
          echo "✅ System timeouts configured"
      
      - name: Create logs directory
        run: mkdir -p logs
      
      - name: Run bronze loader → Supabase (Batch 1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Starting bronze batch 1 (0-500)..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120
      
      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30
      
      - name: Run bronze loader → Supabase (Batch 2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Starting bronze batch 2 (0-500)..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120

      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Run bronze loader → Supabase (Batch 3)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Starting bronze batch 3 (0-500)..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120
      
      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Run bronze loader → Supabase (Batch 4)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Starting bronze batch 4 (0-500)..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120
      
      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Run bronze loader → Supabase (Batch 5)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Starting bronze batch 5 (0-500)..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120
      
      - name: Sleep between batches
        run: |
          echo "⏳ Waiting 30s between batches..."
          sleep 30

      - name: Run bronze loader → Supabase (Batch 6)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 Starting bronze batch 6 (0-500)..."
          python -m pipeline.bronze.loader --start 0 --end 500
        continue-on-error: true
        timeout-minutes: 120

      - name: Upload bronze logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bronze-loader-logs
          path: logs/
          retention-days: 7
      
      - name: Processing statistics
        if: always()
        run: |
          echo "📊 Analyzing processing results..."
          
          if [ -f logs/bronze_loader.log ]; then
            echo ""
            echo "=== Last 100 lines of log ==="
            tail -n 100 logs/bronze_loader.log
            
            echo ""
            echo "=== Statistics ==="
            
            # Count different statuses
            SUCCESS=$(grep -c "✅ Link status updated successfully" logs/bronze_loader.log || echo "0")
            FAILED=$(grep -c "Parse status: failed" logs/bronze_loader.log || echo "0")
            TIMEOUT=$(grep -c "Parse status: timeout" logs/bronze_loader.log || echo "0")
            WEBDRIVER=$(grep -c "Parse status: webdriver_error" logs/bronze_loader.log || echo "0")
            
            echo "Successful: $SUCCESS"
            echo "Failed: $FAILED"
            echo "Timeouts: $TIMEOUT"
            echo "WebDriver errors: $WEBDRIVER"
            
          else
            echo "⚠️ Log file not found"
          fi
  # ==============================================================
  # 3. Silver → Supabase
  # ==============================================================
  silver:
    needs: parse-bronze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - run: pip install -r requirements.txt
      
      - name: Silver → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_silver

  # ==============================================================
  # 4. Gold → Supabase
  # ==============================================================
  gold:
    needs: silver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - run: pip install -r requirements.txt
      
      - name: Gold → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_gold
